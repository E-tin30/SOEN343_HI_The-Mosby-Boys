name: Unit Tests

on:
  pull_request:
  push:
    branches: [main, phase-4]

# A new push to the same branch cancels the older run
concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # The wrapper can lose its executable bit on some checkouts
      - run: chmod +x ./mvnw

      # DishesBeCrazyApplicationTests boots the whole app and needs the Supabase and Stripe
      # secrets from .env, so it is left out here. Every other test runs with no external services.
      - name: Run unit tests
        env:
            SUPABASE_URL: https://example.supabase.co
            SUPABASE_PUBLISHABLE_KEY: dummy
            SUPABASE_DB_URL: jdbc:postgresql://localhost:5432/dummy
            SUPABASE_DB_USER: dummy
            SUPABASE_DB_PASSWORD: dummy
            STRIPE_SECRET_KEY: dummy
        run: ./mvnw -B -ntp test '-Dtest=!DishesBeCrazyApplicationTests,!DemoFixtureLoaderTest,!DemoOrderFixtureTest,!DemoOrderSeederTest,!DemoDataRestorerTest,!DemoMenuSeederTest,!DemoProfileSeederTests,!DemoServiceIntegrationTest'

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore