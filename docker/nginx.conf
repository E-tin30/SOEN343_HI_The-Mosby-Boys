# Serves the frontend's production build and forwards /api/... to the Spring Boot backend in the same container.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Menu photos are uploaded through the backend (the platform allows 25 MB).
    client_max_body_size 25m;

    # The frontend calls /api/<path>. The backend has no /api prefix for most routes
    # (for example /login), so /api is removed here: /api/login becomes /login and
    # /api/api/orders becomes /api/orders.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # No X-Forwarded-Proto line: the platform edge sends X-Forwarded-Proto/Host/Port and nginx passes them on.
        proxy_read_timeout 55s;
    }

    # Everything else is the single-page app; unknown paths fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
