spring:
  config:
    import: optional:file:.env[.properties]
  
  application:
    name: dishes-be-crazy

  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}

  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: validate

  supabase:
    url: ${SUPABASE_URL}
    publishable-key: ${SUPABASE_PUBLISHABLE_KEY}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_URL}/auth/v1
          jwk-set-uri: ${SUPABASE_URL}/auth/v1/.well-known/jwks.json
          audiences:
            - authenticated
          jws-algorithms: ES256
