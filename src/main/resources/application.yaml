spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: dishes-be-crazy

  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}

  flyway:
    enabled: false

  supabase:
    url: ${SUPABASE_URL}
    publishable-key: ${SUPABASE_PUBLISHABLE_KEY}