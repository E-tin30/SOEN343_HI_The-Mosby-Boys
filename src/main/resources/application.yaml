spring:
  config:
    import: optional:file:.env[.properties]
  
  application:
    name: dishes-be-crazy

  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}

  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: validate

  supabase:
    url: ${SUPABASE_URL}
    publishable-key: ${SUPABASE_PUBLISHABLE_KEY}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_URL}/auth/v1
          jwk-set-uri: ${SUPABASE_URL}/auth/v1/.well-known/jwks.json
          audiences:
            - authenticated
          jws-algorithms: ES256

pricing:
  delivery-fee: 4.99
  service-fee-rate: 0.12
  small-order-threshold: 15.00
  small-order-surcharge: 2.50
  gst: 0.05
  qst: 0.09975

stripe:
  secret-key: ${STRIPE_SECRET_KEY}